name: kenosis_plugin_livecast
description: "Kenosis AI - LiveCast plugin. Serves the realtime lecture transcription page over the LAN (NanoHTTPD :8090); bound by the offline host over binder (IKenosisPlugin) for the livecast_* tools."
publish_to: 'none' # Private package — never published to pub.dev.

version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Theme-mode persistence (light/dark/auto) — encrypted at rest, same
  # dependency + KV key ('theme_mode') as the host app.
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The projector page served by LivecastServer on GET /. Self-contained
  # (no CDN) — the viewing laptop may be offline.
  # assets/legal/ = the drawer's Privacy Notice + Open-source licenses pages.
  assets:
    - assets/livecast/index.html
    - assets/legal/
