<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Kenosis AI — Play Store phone screenshot 1080x1920 (site palette) */
  :root {
    --bg: #0a0e14;
    --accent-1: #4f8cff;
    --accent-2: #a26bff;
    --text: #e6ebf4;
    --text-dim: #8b94a8;
    --card-border: rgba(120, 150, 255, 0.25);
    --grad: linear-gradient(100deg, var(--accent-1), var(--accent-2));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background:
      radial-gradient(55% 45% at 25% 20%, rgba(79,140,255,.16), transparent 70%),
      radial-gradient(50% 40% at 80% 30%, rgba(162,107,255,.13), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120,150,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,255,.05) 1px, transparent 1px);
    background-size: 120px 120px;
    mask-image: radial-gradient(75% 55% at 50% 30%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(75% 55% at 50% 30%, #000 30%, transparent 100%);
  }

  .brandrow { position: relative; display: flex; align-items: center; gap: 26px; margin-top: 72px; }
  .brandrow img { width: 84px; height: 84px; border-radius: 19px; display: block; border: 1px solid var(--card-border); }
  .brandname { font-size: 44px; font-weight: 800; letter-spacing: -0.01em; }
  .brandname em { font-style: normal; color: var(--accent-1); }

  .copy { position: relative; margin-top: 64px; text-align: center; padding: 0 70px; }
  h1 { font-size: 78px; line-height: 1.16; font-weight: 800; letter-spacing: -0.02em; }
  h1.small { font-size: 72px; }
  .grad {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 24px; color: var(--text-dim); font-size: 38px; font-weight: 600; line-height: 1.4; }
  .sub strong { color: var(--text); }

  /* stack layout: pitch on top 50%, small phones cascading below */
  body.stack .brandrow { margin-top: 178px; }
  body.stack .copy { margin-top: 38px; }
  body.stack .phone { display: none; }
  .fan { display: none; }
  body.stack .fan { display: block; position: relative; margin-top: auto; height: 930px; width: 100%; flex-shrink: 0; }
  .mini {
    position: absolute; border-radius: 40px; overflow: hidden;
    border: 2px solid rgba(140,170,255,.35);
    box-shadow: 0 34px 80px rgba(0,0,0,.7), 0 0 60px rgba(79,140,255,.15), inset 0 0 0 6px #05070b;
    background: #0d1219;
  }
  .mini img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .mini::before {
    content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 78px; height: 17px; border-radius: 999px; background: #05070b; z-index: 2;
  }
  .m-back  { width: 300px; height: 600px; left: 390px; top: 0;    transform: rotate(-4deg); }
  .m-mid   { width: 300px; height: 600px; left: 315px; top: 165px; transform: rotate(3deg); }
  .m-front { width: 300px; height: 600px; left: 390px; top: 330px; transform: rotate(-2deg); }

  /* pitch chips (stack mode) — pill claims like the Reddit image */
  .chips { display: none; }
  body.stack .chips {
    display: grid; grid-template-columns: repeat(2, max-content); gap: 20px;
    margin-top: 44px; justify-content: center;
  }
  .chips .chip {
    display: flex; align-items: center; gap: 14px;
    padding: 20px 36px; border-radius: 999px;
    background: rgba(79, 140, 255, 0.06); border: 1px solid var(--card-border);
    font-size: 34px; font-weight: 700; color: var(--text);
  }

  /* device frame */
  .phone {
    position: relative; margin-top: 64px;
    width: 640px; height: 1280px; border-radius: 86px;
    background: #141a24;
    border: 3px solid rgba(140,170,255,.35);
    box-shadow: 0 60px 140px rgba(0,0,0,.7), 0 0 90px rgba(79,140,255,.18), inset 0 0 0 10px #05070b;
    padding: 30px;
  }
  .screen { width: 100%; height: 100%; border-radius: 58px; overflow: hidden; position: relative; background: #0d1219; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .pill {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 26px; border-radius: 999px; background: #05070b; z-index: 3;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="brandrow">
    <img src="../assets/icon.png" alt="">
    <div class="brandname">Kenosis <em>AI</em></div>
  </div>
  <div class="copy">
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="phone">
    <div class="pill"></div>
    <div class="screen"><img id="shot" src="" alt=""></div>
  </div>
  <div class="fan" id="fan"></div>
<script>
  // ?shot=<file under assets/screenshots/>&t1=&t2=&sub=   — single phone
  // ?shots=a.png,b.png,c.png&...                          — stacked fan (back to front)
  const q = new URLSearchParams(location.search);
  document.getElementById('title').innerHTML =
    (q.get('t1') || '') + '<br><span class="grad">' + (q.get('t2') || '') + '</span>';
  document.getElementById('sub').innerHTML = (q.get('sub') || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  if (q.get('fs') === 'small') document.getElementById('title').classList.add('small');
  if (q.get('chips')) {
    for (const c of q.get('chips').split('|')) {
      const el = document.createElement('div');
      el.className = 'chip';
      el.textContent = c;
      document.getElementById('chips').appendChild(el);
    }
  }
  if (q.get('shots')) {
    document.body.classList.add('stack');
    const fan = document.getElementById('fan');
    q.get('shots').split(',').forEach((name, i) => {
      const d = document.createElement('div');
      d.className = 'mini ' + (['m-back', 'm-mid', 'm-front'][i] || 'm-front');
      const img = document.createElement('img');
      img.src = '../assets/screenshots/' + name;
      d.appendChild(img);
      fan.appendChild(d);
    });
  } else {
    document.getElementById('shot').src = '../assets/screenshots/' + (q.get('shot') || 'chat.png');
  }
</script>
</body>
</html>
